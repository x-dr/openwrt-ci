name: 360V6-IPQ60XX-6.12-WIFI

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/LiBwrt/LibWrt.git
  REPO_BRANCH: 25.12-nss
  CONFIG_FILE: configs/360v6-ipq60xx-6.12-wifi.config
  DEVICE_PROFILE: qihoo_360v6
  DIY_SCRIPT: libwrt-360v6.sh
  CACHE_TOOLCHAIN: true
  UPLOAD_BIN_DIR: false
  FIRMWARE_RELEASE: true
  FIRMWARE_TAG: 360V6-IPQ60XX-6.12-WIFI
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: ubuntu-24.04

    steps:
    - name: Check Server Performance(检查服务器性能)
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo -e "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU逻辑核心数：$(nproc)"
        echo -e "CPU型号信息：$(awk -F': ' '/^model name/{print $2}' /proc/cpuinfo | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        free -h
        echo ""
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量：$(lsblk -dn -o TYPE | awk '$1=="disk"{c++} END{print c+0}')" && df -hT

    - name: Initialization Environment(初始化环境)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo -E apt-get -yqq install libfuse-dev
        sudo -E apt-get -yqq autoremove --purge
        sudo -E apt-get -yqq autoclean
        sudo -E apt-get -yqq clean
        sudo -E systemctl daemon-reload
        sudo timedatectl set-timezone "$TZ"

    - name: Combine Disks(合并磁盘)
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 1024
        temp-reserve-mb: 100
        root-reserve-mb: 1024

    - name: Checkout
      uses: actions/checkout@v7

    - name: Clone Source Code(克隆源代码)
      run: |
        df -hT "$GITHUB_WORKSPACE"
        git clone --depth 1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
        cd openwrt
        echo "OPENWRT_PATH=$PWD" >> "$GITHUB_ENV"
        VERSION_INFO=$(git show -s --date=short --format="作者: %an<br/>时间: %cd<br/>内容: %s<br/>hash: %H")
        echo "VERSION_INFO=$VERSION_INFO" >> "$GITHUB_ENV"

    - name: Generate Variables(生成变量)
      run: |
        cp "$CONFIG_FILE" "$OPENWRT_PATH/.config"
        cd "$OPENWRT_PATH"
        make defconfig > /dev/null 2>&1
        SOURCE_REPO=$(basename "$REPO_URL")
        echo "SOURCE_REPO=$SOURCE_REPO" >> "$GITHUB_ENV"
        DEVICE_TARGET=$(awk -F '"' '/^CONFIG_TARGET_BOARD=/{print $2}' .config)
        echo "DEVICE_TARGET=$DEVICE_TARGET" >> "$GITHUB_ENV"
        DEVICE_SUBTARGET=$(awk -F '"' '/^CONFIG_TARGET_SUBTARGET=/{print $2}' .config)
        echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> "$GITHUB_ENV"

    - name: Cache Toolchain(缓存工具链)
      if: env.CACHE_TOOLCHAIN == 'true'
      uses: HiGarfield/cachewrtbuild@main
      with:
        ccache: false
        mixkey: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
        prefix: ${{ env.OPENWRT_PATH }}

    - name: Install Feeds(安装feeds)
      run: |
        cd "$OPENWRT_PATH"
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Custom Configuration(加载自定义配置)
      run: |
        [ -e files ] && cp -a files "$OPENWRT_PATH/files"
        [ -e "$CONFIG_FILE" ] && cp "$CONFIG_FILE" "$OPENWRT_PATH/.config"
        chmod +x "$DIY_SCRIPT"
        cd "$OPENWRT_PATH"
        "$GITHUB_WORKSPACE/$DIY_SCRIPT"

    - name: Download DL Package(下载DL软件包)
      run: |
        cd "$OPENWRT_PATH"
        make defconfig
        grep -E '^CONFIG_TARGET_(qualcommax_ipq60xx_DEVICE_|MULTI_PROFILE)' .config || true
        if ! grep -q "^CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_${DEVICE_PROFILE}=y$" .config; then
          echo "Error: target device ${DEVICE_PROFILE} was not selected after make defconfig" >&2
          exit 1
        fi
        if grep -q '^CONFIG_TARGET_MULTI_PROFILE=y$' .config; then
          echo "Error: CONFIG_TARGET_MULTI_PROFILE should not be enabled for ${DEVICE_PROFILE} build" >&2
          exit 1
        fi
        grep -E '^CONFIG_PACKAGE_.*(nikki|mihomo|sing-box|homeproxy|yq|zerotier|netspeedtest|argon|bootstrap|ip-full|kmod-dummy|wireguard)' .config || true
        for pkg in nikki mihomo-meta luci-app-nikki luci-i18n-nikki-zh-cn yq ip-full \
                   kmod-inet-diag kmod-nft-socket kmod-nft-tproxy kmod-tun kmod-dummy \
                   kmod-wireguard wireguard-tools luci-proto-wireguard \
                   luci-theme-bootstrap; do
          if ! grep -q "^CONFIG_PACKAGE_${pkg}=y$" .config; then
            echo "Error: required package ${pkg} was not selected after make defconfig" >&2
            exit 1
          fi
        done
        for pkg in luci-app-homeproxy luci-i18n-homeproxy-zh-cn sing-box \
                   zerotier luci-app-zerotier luci-i18n-zerotier-zh-cn \
                   luci-app-netspeedtest speedtest-cli \
                   luci-theme-argon luci-app-argon-config luci-i18n-argon-config-zh-cn; do
          if grep -q "^CONFIG_PACKAGE_${pkg}=y$" .config; then
            echo "Error: removed package ${pkg} is still enabled after make defconfig" >&2
            exit 1
          fi
        done
        make download -j8
        if [ -n "$(find dl -type f -size -1024c)" ]; then
          find dl -type f -size -1024c -exec ls -l {} \; -delete
          make download -j4
        fi

    - name: Compile Firmware(开始编译固件)
      id: compile
      run: |
        cd "$OPENWRT_PATH"
        echo "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> "$GITHUB_OUTPUT"
        echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> "$GITHUB_ENV"
        echo "FILE_DATE=$(date +"%Y.%m.%d")" >> "$GITHUB_ENV"

    - name: Check Space Usage(检查空间使用情况)
      if: (!cancelled())
      run: df -hT

    - name: Upload Bin Directory(上传固件)
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.SOURCE_REPO }}-bin-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.DEVICE_PROFILE }}-${{ env.FILE_DATE }}
        path: ${{ env.OPENWRT_PATH }}/bin

    - name: Organize Files(整理文件)
      if: steps.compile.outputs.status == 'success'
      run: |
        cd "$OPENWRT_PATH"/bin/targets/*/*
        cat sha256sums
        VERSION_KERNEL=$(find . -maxdepth 1 -type f -name "*.manifest" -print -quit | xargs -r grep -hoP '^kernel - \K.*?(?=~|-\d+-)' | head -n 1 || true)
        echo "VERSION_KERNEL=$VERSION_KERNEL" >> "$GITHUB_ENV"
        cp "$OPENWRT_PATH/.config" build.config
        mkdir -p packages
        find "$OPENWRT_PATH/bin/packages" -type f \( -name "*.apk" -o -name "*.ipk" \) -exec mv -f {} packages/ \;
        tar -zcf Packages.tar.gz packages
        rm -rf packages feeds.buildinfo version.buildinfo
        echo "FIRMWARE_PATH=$PWD" >> "$GITHUB_ENV"

    - name: Upload Firmware To Artifact(将固件上传到Artifact)
      if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.SOURCE_REPO }}-firmware-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.DEVICE_PROFILE }}-${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE_PATH }}

    - name: Upload Firmware To Release(发布固件)
      if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true'
      uses: ncipollo/release-action@v1
      with:
        name: R${{ env.DATE }} for ${{ env.FIRMWARE_TAG }}
        allowUpdates: true
        tag: ${{ env.FIRMWARE_TAG }}
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: ${{ env.FIRMWARE_PATH }}/*
        body: |
          **This is OpenWrt Firmware for ${{ env.FIRMWARE_TAG }}**
          ### 📒 固件信息(360V6-WIFI)
          - 360V6 (${{ env.DEVICE_PROFILE }}) 专属带WIFI带有线NSS的6.12内核固件（配置：`${{ env.CONFIG_FILE }}`）
          - 💻 这是 ${{ env.FIRMWARE_TAG }} 平台使用的 OpenWrt 固件
          - ⚽ 固件源码: ${{ env.REPO_URL }}
          - 💝 源码分支: ${{ env.REPO_BRANCH }}
          - 🌐 默认地址: 192.168.1.1
          - 🔑 默认密码: password
          ### 🧊 固件版本
          - 固件内核版本：${{ env.VERSION_KERNEL }}
          - 固件编译前最后一次➦[主源码](${{ env.REPO_URL }})更新记录
          - ${{ env.VERSION_INFO }}
